name: Publish documentation site

# Publication is an explicit release action. A source push never deploys the site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v6
      - name: Validate committed static pages
        run: python3 tools/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload committed website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
